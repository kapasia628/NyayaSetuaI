name: NyayaSetu AI - Continuous Integration & Quality Assurance

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-evaluate:
    name: Unit & Security Tests (Python 3.11 - 3.14)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Verify Repository Size (< 10MB Hack2Skill Mandate)
        run: |
          REPO_SIZE_KB=$(du -sk . | cut -f1)
          echo "Repository Size: ${REPO_SIZE_KB} KB"
          if [ $REPO_SIZE_KB -gt 10240 ]; then
            echo "ERROR: Repository exceeds Hack2Skill 10MB limit!"
            exit 1
          else
            echo "SUCCESS: Repository is within 10MB compliance."
          fi

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Test Suite with Coverage (>90%)
        run: |
          python -m pytest backend/tests -v --cov=backend/app --cov-report=term-missing --cov-report=xml

      - name: Verify Health Check Endpoint in Docker/Uvicorn
        run: |
          nohup python -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 &
          sleep 3
          curl --fail http://127.0.0.1:8000/api/health || exit 1
